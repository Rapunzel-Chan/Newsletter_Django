{% extends 'newsletter/base.html' %}
{% block title %}Сообщения{% endblock %}

{% block content %}
<div class="container-xxl container-p-y">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="fw-bold">Сообщения</h4>
    <a href="{% url 'newsletter:message_create' %}" class="btn btn-success">Создать</a>
  </div>

  <div class="card"><div class="table-responsive text-nowrap">
    <table class="table">
      <thead class="table-light"><tr>
        <th>ID</th><th>Тема</th><th>Действия</th>
      </tr></thead>
      <tbody class="table-border-bottom-0">
        {% for msg in object_list %}
        <tr>
          <td>#{{ msg.id }}</td>
          <td>{{ msg.theme|default:"(без темы)" }}</td>
          <td>
            <a href="{% url 'newsletter:message_detail' msg.id %}" class="btn btn-sm btn-info">Просмотр</a>
            <a href="{% url 'newsletter:message_update' msg.id %}" class="btn btn-sm btn-warning">Изменить</a>
            <a href="{% url 'newsletter:message_delete' msg.id %}" class="btn btn-sm btn-danger">Удалить</a>
          </td>
        </tr>
        {% empty %}
        <tr><td colspan="3">Сообщений нет.</td></tr>
        {% endfor %}
      </tbody>
    </table>
  </div></div>
</div>
{% endblock %}

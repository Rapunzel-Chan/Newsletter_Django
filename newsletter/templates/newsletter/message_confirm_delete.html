{% extends 'newsletter/base.html' %}
{% block title %}Удалить сообщение{% endblock %}

{% block content %}
<div class="container-xxl container-p-y">
  <h4 class="fw-bold mb-3">Удалить сообщение #{{ object.id }}?</h4>
  <div class="card mb-4"><div class="card-body">
    <form method="post">
      {% csrf_token %}
      <p>Вы уверены, хотите удалить сообщение "{{ object.theme|default:'(без темы)' }}"?</p>
      <button type="submit" class="btn btn-danger">Удалить</button>
      <a href="{% url 'newsletter:message_detail' object.id %}" class="btn btn-secondary">Отмена</a>
    </form>
  </div></div>
</div>
{% endblock %}

{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8"/>
    <title>{% block title %}Newsletter Admin{% endblock %}</title>

    <!-- Sneat Bootstrap CSS -->
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}"/>
    <link rel="stylesheet" href="{% static 'css/boxicons.css' %}"/>
    <link rel="stylesheet" href="{% static 'css/theme-default.css' %}"/>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    {% block extra_css %}{% endblock %}

    {% if not request.user.is_authenticated %}
      <meta http-equiv="Cache-Control" content="max-age=600" />
      <meta http-equiv="Pragma" content="cache" />
    {% endif %}
</head>

<body>
<header class="p-3 mb-4 border-bottom">
    <div class="container d-flex flex-wrap justify-content-between align-items-center">
        <a href="{% url 'newsletter:mailing_list' %}"
           class="d-flex align-items-center mb-2 mb-lg-0 text-dark text-decoration-none">
            <span class="fs-4 fw-semibold">Newsletter Admin</span>
        </a>

        {% include 'newsletter/inc_menu.html' %}

    </div>
</header>

<main class="container">
    {% block content %}{% endblock %}
</main>

{% block extra_js %}{% endblock %}
</body>
</html>

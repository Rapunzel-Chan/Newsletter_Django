{% extends "newsletter/base.html" %}
{% load form_filter %}

{% block title %}Создать рассылку{% endblock %}

{% block content %}
<div class="container-xxl flex-grow-1 container-p-y">
    <h4 class="fw-bold py-3 mb-4">Создание рассылки</h4>

    <div class="card">
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                <!-- Сообщение -->
                <div class="mb-3 d-flex align-items-end">
                    <div class="flex-grow-1 me-2">
                        <label for="{{ form.message.id_for_label }}" class="form-label">Сообщение</label>
                        {{ form.message|add_class:"form-select" }}
                    </div>
                    <a href="{% url 'newsletter:message_create' %}" class="btn btn-outline-primary"
                       title="Добавить сообщение">
                        <i class="bx bx-plus"></i>
                    </a>
                </div>

                <!-- Клиенты -->
                <div class="mb-3 d-flex align-items-end">
                    <div class="flex-grow-1 me-2">
                        <label for="{{ form.clients.id_for_label }}" class="form-label">Получатели</label>
                        {{ form.clients|add_class:"form-select" }}
                    </div>
                    <a href="{% url 'newsletter:client_create' %}" class="btn btn-outline-primary"
                       title="Добавить клиента">
                        <i class="bx bx-plus"></i>
                    </a>
                </div>

                <!-- Кнопки -->
                <button type="submit" class="btn btn-primary">Сохранить</button>
                <a href="{% url 'newsletter:mailing_list' %}" class="btn btn-outline-secondary">Отмена</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}

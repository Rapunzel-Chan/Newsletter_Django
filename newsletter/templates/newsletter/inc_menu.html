<nav class="nav">
    {% if user.is_authenticated %}
        <a href="{% url 'newsletter:mailing_list' %}" class="nav-link px-2 link-secondary">Рассылки</a>
        <a href="{% url 'newsletter:client_list' %}" class="nav-link px-2 link-dark">Клиенты</a>
        <a href="{% url 'newsletter:message_list' %}" class="nav-link px-2 link-dark">Сообщения</a>
        <a href="{% url 'newsletter:attempt_list' %}" class="nav-link px-2 link-dark">Попытки рассылок</a>

        <form action="{% url 'users:logout' %}" method="post" class="d-inline ms-3">
            {% csrf_token %}
            <button class="btn btn-link nav-link px-2" type="submit">Выход</button>
        </form>
    {% else %}
        <a href="{% url 'users:login' %}" class="nav-link px-2">Вход</a>
        <a href="{% url 'users:register' %}" class="nav-link px-2">Регистрация</a>
        <a href="{% url 'users:password_reset' %}" class="nav-link px-2">Забыли пароль?</a>
    {% endif %}
</nav>

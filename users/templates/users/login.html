{% extends 'newsletter/base.html' %}
{% load widget_tweaks %}
{% block title %}Вход{% endblock %}
{% block content %}
<div class="container mt-5">
    <div class="card mx-auto" style="max-width: 400px;">
        <div class="card-body">
            <h4 class="mb-4 text-center">Вход</h4>
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="{{ form.username.id_for_label }}" class="form-label">Email</label>
                    {{ form.username|add_class:"form-control" }}
                </div>
                <div class="mb-3">
                    <label for="{{ form.password.id_for_label }}" class="form-label">Пароль</label>
                    {{ form.password|add_class:"form-control" }}
                </div>
                <button type="submit" class="btn btn-primary w-100">Войти</button>
            </form>
            <div class="mt-3 text-center">
                <a href="{% url 'users:password_reset' %}">Забыли пароль?</a><br>
                <span>Нет аккаунта?</span> <a href="{% url 'users:register' %}">Регистрация</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}

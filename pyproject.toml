[tool.poetry]
name = "webapp-djangonewsletter"
version = "0.1.0"
description = ""
authors = ["Rapunzel <osina_kv@mail.ru>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
requests = "^2.32.4"
python-dotenv = "^1.1.1"
psycopg2-binary = "^2.9.10"
django = "^5.2.4"
dotenv = "^0.9.9"
ipython = "^9.4.0"
django-redis = "^6.0.0"


[tool.poetry.group.lint.dependencies]
flake8 = "^7.3.0"
black = "^25.1.0"
mypy = "^1.16.1"
isort = "^6.0.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.coverage.report]
exclude_also = [
    'if __name__ == .__main__.:'
]

[tool.isort]
line_length = 119

[tool.black]
line-length = 119
exclude = ".git"

[tool.mypy]
disallow_untyped_defs=true
warn_return_any=true
exclude = 'venv'
